on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**.toml"

permissions:
  contents: read

jobs:
  toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4.0.0

      - uses: tombi-toml/setup-tombi@v1.7.0

      - name: Do Check
        run: |
          just toml-check
