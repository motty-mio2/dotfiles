on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**.toml"

jobs:
  toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - uses: tombi-toml/setup-tombi@d8f3250344c4e9107b91c02bc11efcf72baf5793 # v1.7.3

      - name: Do Check
        run: |
          just toml-check
