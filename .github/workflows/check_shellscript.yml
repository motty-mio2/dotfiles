on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**.sh"
      - "**.sh.tmpl"

permissions:
  contents: read

jobs:
  shellscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: mfinelli/setup-shfmt@v4.0.1
      - uses: extractions/setup-just@v4.0.0

      - name: Do Check
        run: |
          just shell
