name: Test Linux setup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-linux.yml'
      - '.chezmoidata/dependencies.toml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-linux.yml'
      - '.chezmoidata/dependencies.toml'

jobs:
  test:
    name: Validate (Linux, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Dotfiles
        uses: ./.github/actions/setup-dotfiles
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Validate Nix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
          nix-channel --update
          # shellcheck disable=SC2016
          nix_pkgs=$(~/.local/bin/chezmoi execute-template '{{ range $section, $deps := .dependencies -}}{{- if or (eq $section "cli") (eq $section "dev") (eq $section "desktop") -}}{{- range $name, $m := $deps -}}{{- if hasKey $m "nix" -}}{{- get $m "nix" | printf "%s " -}}{{- end -}}{{- end -}}{{- end -}}{{- end }}')
          # Import and evaluate nixpkgs once for all packages. Re-importing it for
          # every package is the dominant cost of this validation.
          export NIX_PKGS="$nix_pkgs"
          nix_results=$(nix-instantiate --eval --strict --json -E '
            let
              pkgs = import <nixpkgs> {};
              names = builtins.filter builtins.isString
                (builtins.split "[[:space:]]+" (builtins.getEnv "NIX_PKGS"));
              check = name:
                if builtins.hasAttr name pkgs then
                  let pkg = builtins.getAttr name pkgs;
                  in if builtins.elem pkgs.stdenv.hostPlatform.system
                    (pkg.meta.platforms or [ pkgs.stdenv.hostPlatform.system ])
                  then "ok"
                  else "unsupported"
                else "missing";
            in builtins.listToAttrs (map (name: { inherit name; value = check name; }) names)
          ' 2>/dev/null) || {
            echo "::warning::Failed to evaluate nixpkgs."
            exit 0
          }

          while IFS=$'\t' read -r pkg check_result; do
            echo "Checking Nix: $pkg"
            case "$check_result" in
              unsupported)
                echo "::warning::Package $pkg is not supported on this platform. Skipping."
                ;;
              missing)
                echo "::warning::Nix package not found in nixpkgs: $pkg"
                ;;
            esac
          done < <(printf '%s' "$nix_results" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')

