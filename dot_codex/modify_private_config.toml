{{- /* chezmoi:modify-template */ -}}
{{- /* 現在の ~/.codex/config.toml が .chezmoi.stdin に渡される。管理する設定だけ上書きし、その他の既存設定は保持する。 */ -}}
{{- $config := dict -}}
{{- if .chezmoi.stdin -}}
{{-   $config = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $managed := fromToml `
[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
` -}}
{{ mergeOverwrite $config $managed | toToml -}}
